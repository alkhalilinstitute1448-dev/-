name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend to prevent cold start
        run: curl -sf -o /dev/null --max-time 90 https://alkhaleel-academy.onrender.com/api/connection-status || true
